<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRONOTE AI</title><link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header><div><h1>PRONOTE AI</h1><p>Mon assistant scolaire</p></div><button id="addBtn">+ Ajouter</button></header>
<main>
<section class="stats"><div><span id="testsCount">0</span><small>Contrôles</small></div><div><span id="tasksCount">0</span><small>Devoirs</small></div><div><span id="doneCount">0</span><small>Terminés</small></div></section>
<section class="panel"><div class="panel-head"><h2>À faire</h2><select id="filter"><option value="all">Tout</option><option value="controle">Contrôles</option><option value="devoir">Devoirs</option><option value="cours">Cours</option></select></div><div id="taskList"></div></section>
<section id="assistant" class="panel assistant hidden"><div class="panel-head"><h2>🤖 Assistant IA</h2><button id="closeAssistant">×</button></div><div id="assistantContent"></div></section>
</main>
<div id="modal" class="modal hidden"><form id="taskForm" class="modal-card"><button type="button" class="close" id="closeBtn">×</button><h2>Ajouter une tâche</h2><input id="title" placeholder="Titre" required><input id="subject" placeholder="Matière" required><select id="type"><option value="devoir">Devoir</option><option value="controle">Contrôle</option><option value="cours">Cours</option></select><input id="date" type="date" required><textarea id="description" placeholder="Consigne, chapitre, contenu…"></textarea><button class="primary" type="submit">Ajouter</button></form></div>
<script src="app.js?v=2"></script>
</body></html>
